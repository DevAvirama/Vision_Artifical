[project]
name = "vision-artificial"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "DevAvirama", email = "santyaviramagnf@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "numpy>=2.5.2",
    "opencv-python>=5.0.0.93",
